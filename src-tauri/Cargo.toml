[package]
name = "projection-church"
version = "0.2.52"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "dialog-all", "http-all", "fs-all", "shell-open", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking"] } 
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.6"
actix-web-actors = "4"
actix = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
local-ip-address = "0.5" 
base64 = "0.21" 
serde_urlencoded = "0.7" 
tauri-plugin-sql = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1", features = ["sqlite"] } 
winreg = "0.52" 

[features]
# by default Tauri runs in production mode
# when `tauri dev` is run it is executed with `custom-protocol` feature
custom-protocol = ["tauri/custom-protocol"]
